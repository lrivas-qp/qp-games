<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Snake</title>
  <script>
    /* Misma regla que applyTouchMode() en app.js: cruceta en táctil o ?touch=1 */
    (function () {
      var param = new URLSearchParams(location.search).get('touch');
      var on;
      if (param === '1' || param === 'true') on = true;
      else if (param === '0' || param === 'false') on = false;
      else {
        var coarse = window.matchMedia('(pointer: coarse)').matches;
        var noHover = window.matchMedia('(hover: none)').matches;
        var points = (navigator.maxTouchPoints || 0) > 0;
        on = coarse || noHover || points;
      }
      document.documentElement.classList.add(on ? 'touch-on' : 'touch-off');
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
</head>
<body>
  <!-- HUD -->
  <div id="hud">
    <div class="hud-cell">
      <span class="hud-label">SCORE</span>
      <span id="score-display">0</span>
    </div>
    <div class="hud-cell">
      <span class="hud-label">BEST</span>
      <span id="best-display">0</span>
    </div>
    <div class="hud-cell">
      <span class="hud-label">SPEED</span>
      <span id="speed-display">1</span>
    </div>
  </div>

  <!-- Tablero -->
  <div id="board-wrap">
    <canvas id="board"></canvas>
  </div>

  <!-- Cruceta táctil (móvil y tótem). Visible con puntero grueso o ?touch=1 -->
  <div id="touch-controls" role="group" aria-label="Dirección de la serpiente" aria-hidden="true">
    <div class="dpad">
      <button type="button" class="dpad-btn dpad-up" data-dir="up" aria-label="Arriba">▲</button>
      <button type="button" class="dpad-btn dpad-left" data-dir="left" aria-label="Izquierda">◀</button>
      <button type="button" class="dpad-btn dpad-right" data-dir="right" aria-label="Derecha">▶</button>
      <button type="button" class="dpad-btn dpad-down" data-dir="down" aria-label="Abajo">▼</button>
    </div>
  </div>

  <!-- Pantalla de inicio -->
  <div id="start-screen" class="overlay active">
    <div class="overlay-card">
      <div class="game-logo">
        <div class="logo-title">🐍 SNAKE</div>
        <div class="logo-subtitle">Come · Crece · Sobrevive</div>
      </div>
      <div class="leaderboard-section">
        <h3 class="section-title">🏆 TOP 10</h3>
        <ol id="leaderboard-list" class="leaderboard-list">
          <li class="lb-loading">Cargando ranking...</li>
        </ol>
      </div>
      <button id="btn-start" class="btn btn-primary">▶ INICIAR JUEGO</button>
      <a href="../" class="btn btn-secondary">🎮 Volver a Juegos QP</a>
      <p class="controls-hint">
        Flechas o WASD · En táctil usa la cruceta o desliza el dedo · No choques contigo ni con los bordes
      </p>
    </div>
  </div>

  <!-- Pantalla de Game Over -->
  <div id="gameover-screen" class="overlay">
    <div class="overlay-card">
      <h2 class="gameover-title">💀 GAME OVER</h2>
      <div class="final-stats">
        <div class="stat-row"><span>Puntuación</span><span id="final-score">0</span></div>
        <div class="stat-row"><span>Longitud</span><span id="final-length">0</span></div>
      </div>
      <div class="name-entry">
        <label for="player-name">Tu nombre:</label>
        <input type="text" id="player-name" maxlength="20" placeholder="Escribe tu nombre..." autocomplete="off">
      </div>
      <button id="btn-submit-score" class="btn btn-primary">💾 GUARDAR PUNTUACIÓN</button>
      <button id="btn-play-again" class="btn btn-secondary">🔄 JUGAR DE NUEVO</button>
      <button id="btn-back-to-menu" class="btn btn-secondary">🏠 VER RANKING</button>
    </div>
  </div>

  <!-- Overlay de cuenta regresiva -->
  <div id="countdown-overlay" class="overlay">
    <div class="countdown-num" id="countdown-num">3</div>
  </div>

  <script type="module" src="app.js?v=2"></script>
</body>
</html>
