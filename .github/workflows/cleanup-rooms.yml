name: Limpiar salas expiradas (STOP)

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo listar lo que se borraría (no borra)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cleanup-rooms
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Eliminar salas expiradas
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: node .github/scripts/cleanup-expired-rooms.mjs
